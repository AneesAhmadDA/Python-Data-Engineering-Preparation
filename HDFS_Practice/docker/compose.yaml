services:

  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    container_name: hdfs-lab-namenode
    user: "0:0"
    command: >
      bash -c "
      mkdir -p /hadoop/dfs/name &&
      if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
        echo 'Formatting HDFS learning NameNode...' &&
        hdfs namenode -format -nonInteractive;
      fi &&
      hdfs namenode
      "
    
    ports:
      - "19870:9870"
      - "19020:8020"

    volumes:
      - hdfs_namenode_data:/hadoop/dfs/name
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ../scripts:/workspace/scripts:ro

    networks:
      - hdfs-learning-network

    restart: unless-stopped


  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    container_name: hdfs-lab-datanode

    user: "0:0"

    command:
      - bash
      - -c
      - |
        mkdir -p /hadoop/dfs/data
        hdfs datanode

    ports:
      - "19864:9864"

    volumes:
      - hdfs_datanode_data:/hadoop/dfs/data
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode

    networks:
      - hdfs-learning-network

    restart: unless-stopped

volumes:
  hdfs_namenode_data:
    name: hdfs-learning-namenode-data

  hdfs_datanode_data:
    name: hdfs-learning-datanode-data


networks:
  hdfs-learning-network:
    name: hdfs-learning-network
    driver: bridge